# One entry per tool. render_table.py builds both README tables from this file.
#
# taps: where in the request path the tool takes a measurement.
#   crawl    AI agent requests in your server logs
#   fanout   the sub queries an engine runs before it answers
#   answer   mentions and citations inside the generated answer
#   click    visits that arrive from an AI answer
# The "Blind to" column is the complement of `taps`. Never type it.
#
# price is the monthly entry price as a number, or null when there is no
# public number. Plans change often, so confirm before you buy.

- id: aiclicks
  name: AIclicks
  url: https://aiclicks.io
  taps: [fanout, answer, click]
  capture: Daily prompt runs on each engine you pick
  engines: 3 on Starter, you pick
  currency: "$"
  price: 59
  price_note: 3 day trial
  volume: 30 prompts, run daily
  dev: REST API and MCP server on Pro and Business, CSV export on every plan

